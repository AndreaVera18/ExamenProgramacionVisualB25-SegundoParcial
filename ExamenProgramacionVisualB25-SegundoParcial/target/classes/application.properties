spring.application.name=vacaciones-api
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/vacaciones_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=vacaciones_user
spring.datasource.password=vacaciones_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=never
