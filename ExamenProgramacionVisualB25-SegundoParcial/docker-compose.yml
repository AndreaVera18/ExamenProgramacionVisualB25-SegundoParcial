services:
  mysql:
    image: mysql:8.0
    container_name: examen_mysql_vacaciones
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: vacaciones_db
      MYSQL_USER: vacaciones_user
      MYSQL_PASSWORD: vacaciones_pass
    ports:
      - "3307:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "vacaciones_user", "-pvacaciones_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: examen_api_vacaciones
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vacaciones_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: vacaciones_user
      SPRING_DATASOURCE_PASSWORD: vacaciones_pass
    ports:
      - "8088:8080"
